version: '3.8'

services:
  rag-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - RELOAD=false
      # Add your actual credentials in .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - DATABASE_URL=${DATABASE_URL}
      - SUPERADMIN_TOKEN=${SUPERADMIN_TOKEN:-B946C6F2747914D24C1F6C74F5AB5291}
    env_file:
      - .env
    volumes:
      # Persist uploaded documents
      - ./uploaded_documents:/app/uploaded_documents
      - ./profile_images:/app/profile_images
    restart: unless-stopped

